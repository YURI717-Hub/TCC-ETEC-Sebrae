<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | AutoPeças Express</title>
    <link rel="stylesheet" href="../css/headerfooter.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
 <header>
  <div class="navbar">

    <div class="header-linear-content">

      <a href="../../home.html">
        <h1 class="logo"> AutoPeças <span> Express </span></h1>
      </a>

      <nav>
        <ul>
          <li><a href="perfil.html">Meu Perfil</a></li>
          <li><a href="produto.html">Produtos</a></li>
          <li><a href="sobre.html">Sobre</a></li>
        </ul>
      </nav>

      <div class="right-items">

        <figure class="nav-icon-container">
          <a href="carrinho.html">
            <img src="../images/carrinho.png" alt="Carrinho de compras">
          </a>
        </figure>

        <ul class="login">
          <li><a href="login.html">Entrar</a></li>
          <li>|</li>
          <li><a href="cadastro.html">Cadastro</a></li>
        </ul>

        <button type="button" class="menu-button" aria-label="Abrir menu" onclick="menu();">
          <img src="../images/menu.png" alt="">
        </button>

      </div>

    </div>

  </div>
</header>

<main class="cadastro-wrapper">

  <div class="selecao-tipo" id="selecaoTipo">
      <h2>Como deseja se cadastrar?</h2>
      <div class="selecao-botoes">
        <button type="button" class="tipo-btn" id="btnUsuario">Sou Cliente</button>
        <button type="button" class="tipo-btn" id="btnFornecedor">Sou Fornecedor</button>
      </div>
  </div>

  <div id="formUsuario" class="form-secao">
      <div class="cadastro-container">
          <h2 class="cadastro-title">Criar Conta - Usuário</h2>

          <form id="formCadastroUsuario" novalidate>

              <div class="linha">
                  <div class="campo">
                      <label for="nome">* Nome completo</label>
                      <input type="text" id="nome" required>
                  </div>

                  <div class="campo">
                      <label for="cpf">* CPF</label>
                      <input type="text" id="cpf" required>
                  </div>
              </div>

              <div class="linha">
                  <div class="campo">
                      <label for="email">* E-mail</label>
                      <input type="email" id="email" required>
                  </div>

                  <div class="campo">
                      <label for="confEmail">* Confirme E-mail</label>
                      <input type="email" id="confEmail" required>
                  </div>
              </div>

              <div class="linha">
                  <div class="campo">
                      <label for="senha">* Senha</label>
                      <input type="password" id="senha" minlength="6" required>
                  </div>

                  <div class="campo">
                      <label for="confSenha">* Confirme a senha</label>
                      <input type="password" id="confSenha" minlength="6" required>
                  </div>
              </div>

              <div class="form-group">
                  <label for="client-cep">* CEP</label>
                  <input type="text" id="client-cep" placeholder="00000-000" required>
              </div>

              <div id="endereco-bloco" class="endereco-bloco">

                  <div class="form-group">
                      <label for="client-rua">* Endereço</label>
                      <input type="text" id="client-rua">
                  </div>

                  <div class="form-group">
                      <label for="client-numero">* Número</label>
                      <input type="text" id="client-numero">
                  </div>

                  <div class="form-group">
                      <label for="client-bairro">* Bairro</label>
                      <input type="text" id="client-bairro">
                  </div>

                  <div class="form-group">
                      <label for="client-cidade">* Cidade</label>
                      <input type="text" id="client-cidade">
                  </div>

                  <div class="form-group">
                      <label for="client-estado">* Estado</label>
                      <input type="text" id="client-estado">
                  </div>

              </div>

              <div class="checkbox-area">
                  <label>
                      <input type="checkbox" id="termos" required>
                      Aceito os termos de <a href="#">Privacidade</a> e <a href="#">Trocas e Devoluções</a>
                  </label>
              </div>

              <p class="erro-msg" id="erro-usuario" role="alert"></p>

              <button type="button" class="btn-cadastrar" id="btn-cadastrar-usuario">CADASTRAR</button>
          </form>
      </div>
  </div>


  <div id="formFornecedor" class="form-secao">
      <div class="cadastro-container">
          <h2 class="cadastro-title">Cadastro de Fornecedor</h2>

          <form id="formCadastroFornecedor" novalidate>
              <div class="campo">
                  <label for="forn-nome">* Nome da Empresa</label>
                  <input type="text" id="forn-nome" required>
              </div>

              <div class="campo">
                  <label for="forn-cnpj">* CNPJ</label>
                  <input type="text" id="forn-cnpj" required>
              </div>

              <div class="campo">
                  <label for="forn-email">* E-mail Comercial</label>
                  <input type="email" id="forn-email" required>
              </div>

              <div class="campo">
                  <label for="forn-tel">* Telefone</label>
                  <input type="text" id="forn-tel" required>
              </div>

              <div class="linha">
                  <div class="campo">
                      <label for="forn-senha">* Senha</label>
                      <input type="password" id="forn-senha" minlength="6" required>
                  </div>

                  <div class="campo">
                      <label for="forn-confSenha">* Confirme a senha</label>
                      <input type="password" id="forn-confSenha" minlength="6" required>
                  </div>
              </div>

              <div class="form-group">
                  <label for="forn-cep">* CEP</label>
                  <input type="text" id="forn-cep" placeholder="00000-000" required>
              </div>

              <div id="endereco-fornecedor" class="endereco-bloco">
                  <div class="form-group">
                      <label for="forn-rua">* Endereço</label>
                      <input type="text" id="forn-rua">
                  </div>

                  <div class="form-group">
                      <label for="forn-numero">* Número</label>
                      <input type="text" id="forn-numero">
                  </div>

                  <div class="form-group">
                      <label for="forn-bairro">* Bairro</label>
                      <input type="text" id="forn-bairro">
                  </div>

                  <div class="form-group">
                      <label for="forn-cidade">* Cidade</label>
                      <input type="text" id="forn-cidade">
                  </div>

                  <div class="form-group">
                      <label for="forn-estado">* Estado</label>
                      <input type="text" id="forn-estado">
                  </div>
              </div>

              <p class="erro-msg" id="erro-fornecedor" role="alert"></p>

              <button type="button" class="btn-cadastrar" id="btn-cadastrar-fornecedor">CADASTRAR FORNECEDOR</button>
          </form>
      </div>
  </div>

</main>

<script src="../js/menu.js"></script>

<script>
    document.getElementById("btnUsuario").onclick = () => {
        document.getElementById("selecaoTipo").style.display = "none";
        document.getElementById("formUsuario").style.display = "block";
    };

    document.getElementById("btnFornecedor").onclick = () => {
        document.getElementById("selecaoTipo").style.display = "none";
        document.getElementById("formFornecedor").style.display = "block";
    };
</script>

<script type="module">
import {
    auth,
    db,
    ref,
    set,
    createUserWithEmailAndPassword
} from "../js/firebaseConfig.js";

// Traduz os códigos de erro mais comuns do Firebase Auth pra algo legível.
function mensagemErroFirebase(error) {
    const codigo = error?.code || "";

    if (codigo.includes("email-already-in-use")) return "Esse e-mail já está cadastrado.";
    if (codigo.includes("invalid-email")) return "E-mail inválido.";
    if (codigo.includes("weak-password")) return "A senha precisa ter pelo menos 6 caracteres.";
    if (codigo.includes("network-request-failed")) return "Falha de conexão. Verifique sua internet e tente novamente.";

    console.error("Erro no cadastro:", error);
    return "Não foi possível concluir o cadastro. Tente novamente.";
}

// ======================================================
//        BUSCA CEP USUÁRIO
// ======================================================
document.getElementById("client-cep").addEventListener("blur", async () => {
    const cepInput = document.getElementById("client-cep");
    const cep = cepInput.value.replace(/\D/g, "");

    if (cep.length !== 8) return;

    try {
        const data = await fetch(`https://viacep.com.br/ws/${cep}/json/`).then((r) => r.json());

        if (data.erro) {
            alert("CEP não encontrado!");
            return;
        }

        document.getElementById("client-rua").value = data.logradouro;
        document.getElementById("client-bairro").value = data.bairro;
        document.getElementById("client-cidade").value = data.localidade;
        document.getElementById("client-estado").value = data.uf;

        document.getElementById("endereco-bloco").classList.add("aberto");
    } catch (err) {
        console.error("Erro ao buscar CEP:", err);
        alert("Não foi possível buscar o CEP agora. Tente novamente.");
    }
});

// ======================================================
//       BUSCA CEP FORNECEDOR
// ======================================================
document.getElementById("forn-cep").addEventListener("blur", async () => {
    const cepInput = document.getElementById("forn-cep");
    const cep = cepInput.value.replace(/\D/g, "");

    if (cep.length !== 8) return;

    try {
        const data = await fetch(`https://viacep.com.br/ws/${cep}/json/`).then((r) => r.json());

        if (data.erro) {
            alert("CEP não encontrado!");
            return;
        }

        document.getElementById("forn-rua").value = data.logradouro;
        document.getElementById("forn-bairro").value = data.bairro;
        document.getElementById("forn-cidade").value = data.localidade;
        document.getElementById("forn-estado").value = data.uf;

        document.getElementById("endereco-fornecedor").classList.add("aberto");
    } catch (err) {
        console.error("Erro ao buscar CEP:", err);
        alert("Não foi possível buscar o CEP agora. Tente novamente.");
    }
});

// ======================================================
//       CADASTRAR USUÁRIO
// ======================================================
const btnUsuarioCadastrar = document.getElementById("btn-cadastrar-usuario");

btnUsuarioCadastrar.onclick = async () => {
    const form = document.getElementById("formCadastroUsuario");
    const erroEl = document.getElementById("erro-usuario");
    erroEl.textContent = "";

    // Antes o botão era type="button", então o navegador nunca validava os
    // campos "required" sozinho. reportValidity() faz essa checagem manualmente.
    if (!form.reportValidity()) return;

    const email = document.getElementById("email").value.trim();
    const confEmail = document.getElementById("confEmail").value.trim();
    const senha = document.getElementById("senha").value;
    const confSenha = document.getElementById("confSenha").value;

    if (email !== confEmail) {
        erroEl.textContent = "Os e-mails não coincidem.";
        return;
    }

    if (senha !== confSenha) {
        erroEl.textContent = "As senhas não coincidem.";
        return;
    }

    btnUsuarioCadastrar.disabled = true;
    btnUsuarioCadastrar.textContent = "Cadastrando...";

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;

        await set(ref(db, "usuarios/" + user.uid), {
            nome: document.getElementById("nome").value,
            cpf: document.getElementById("cpf").value,
            email: email,
            cep: document.getElementById("client-cep").value
        });

        window.location.href = "login.html";
    } catch (error) {
        erroEl.textContent = mensagemErroFirebase(error);
        btnUsuarioCadastrar.disabled = false;
        btnUsuarioCadastrar.textContent = "CADASTRAR";
    }
};

// ======================================================
//       CADASTRAR FORNECEDOR
// ======================================================
const btnFornecedorCadastrar = document.getElementById("btn-cadastrar-fornecedor");

btnFornecedorCadastrar.onclick = async () => {
    const form = document.getElementById("formCadastroFornecedor");
    const erroEl = document.getElementById("erro-fornecedor");
    erroEl.textContent = "";

    if (!form.reportValidity()) return;

    const email = document.getElementById("forn-email").value.trim();
    const senha = document.getElementById("forn-senha").value;
    const confSenha = document.getElementById("forn-confSenha").value;

    if (senha !== confSenha) {
        erroEl.textContent = "As senhas não coincidem.";
        return;
    }

    btnFornecedorCadastrar.disabled = true;
    btnFornecedorCadastrar.textContent = "Cadastrando...";

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;

        await set(ref(db, "fornecedores/" + user.uid), {
            empresa: document.getElementById("forn-nome").value,
            cnpj: document.getElementById("forn-cnpj").value,
            email: email,
            telefone: document.getElementById("forn-tel").value,
            cep: document.getElementById("forn-cep").value
        });

        window.location.href = "perfilFornecedor.html";
    } catch (error) {
        erroEl.textContent = mensagemErroFirebase(error);
        btnFornecedorCadastrar.disabled = false;
        btnFornecedorCadastrar.textContent = "CADASTRAR FORNECEDOR";
    }
};
</script>

</body>
</html>
